---
layout: default
---
<!-- _layouts/cv.html -->
<div class="post">
  <header class="post-header">
    <h1 class="post-title">
      {{ page.title }}
      {% if page.cv_pdf %}
        <a href="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }}" target="_blank" rel="noopener noreferrer" class="float-right" aria-label="Open CV PDF">
          <i class="fas fa-file-pdf"></i>
        </a>
      {% endif %}
    </h1>
    <p class="post-description">{{ page.description }}</p>
  </header>

  {% if page.cv_pdf %}
    <div class="cv-mobile-link">
      <a href="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-sm z-depth-0">
        Open CV PDF
      </a>
    </div>

    <object class="cv-pdf" data="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }}" width="100%" height="1000" type="application/pdf">
      <p>
        Your browser cannot display the embedded PDF.
        <a href="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }}">Open the CV PDF</a>.
      </p>
    </object>
  {% endif %}
</div>
